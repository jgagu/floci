# This workflow installs the latest version of Terraform CLI and configures the Terraform CLI configuration file
# with an API token for Terraform Cloud (app.terraform.io). On pull request events, this workflow will run
# `terraform init`, `terraform fmt`, and `terraform plan` (speculative plan via Terraform Cloud). On push events
# to the "main" branch, `terraform apply` will be executed.
#
# Documentation for `hashicorp/setup-terraform` is located here: https://github.com/hashicorp/setup-terraform
#
# To use this workflow, you will need to complete the following setup steps.
#
# 1. Create a `main.tf` file in the root of this repository with the `remote` backend and one or more resources defined.
#   Example `main.tf`:
#     # The configuration for the `remote` backend.
#     terraform {
#       backend "remote" {
#         # The name of your Terraform Cloud organization.
#         organization = "example-organization"
#
#         # The name of the Terraform Cloud workspace to store Terraform state files in.
#         workspaces {
#           name = "example-workspace"
#         }
#       }
#     }
#
#     # An example resource that does nothing.
#     resource "null_resource" "example" {
#       triggers = {
#         value = "A example resource that does nothing!"
#       }
#     }
#
#
# 2. Generate a Terraform Cloud user API token and store it as a GitHub secret (e.g. TF_API_TOKEN) on this repository.
#   Documentation:
#     - https://www.terraform.io/docs/cloud/users-teams-organizations/api-tokens.html
#     - https://help.github.com/en/actions/configuring-and-managing-workflows/creating-and-storing-encrypted-secrets
#
# 3. Reference the GitHub secret in step using the `hashicorp/setup-terraform` GitHub Action.
#   Example:
#     - name: Setup Terraform
#       uses: hashicorp/setup-terraform@v1
#       with:
#         cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

name: 'Terraform'

on:
  push:

permissions:
  contents: read

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    environment: production
    env:
      FLOCI_CONTAINER: floci-ci-${{ github.run_id }}-${{ github.run_attempt }}
      TF_VAR_subscription_id: ${{ vars.FLOCI_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ vars.FLOCI_TENANT_ID }}
      TF_VAR_client_id: ${{ vars.FLOCI_CLIENT_ID }}
      TF_VAR_client_secret: ${{ secrets.FLOCI_CLIENT_SECRET }}
      TF_VAR_floci_ci_linux: "true"
      TF_INPUT: "0"

    # Use the Bash shell regardless whether the GitHub Actions runner is ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        shell: bash

    steps:
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      uses: actions/checkout@v4

    - name: Check Floci configuration
      run: |
        for name in TF_VAR_subscription_id TF_VAR_tenant_id TF_VAR_client_id TF_VAR_client_secret; do
          if [ -z "${!name:-}" ]; then
            echo "Missing required GitHub variable or secret for $name." >&2
            exit 1
          fi
        done

    # Install the latest version of Terraform CLI and configure the Terraform CLI configuration file with a Terraform Cloud user API token
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

    # Start an isolated emulator; its anonymous data volume is removed at cleanup.
    - name: Start Floci-AZ
      run: |
        docker run -d --name "$FLOCI_CONTAINER" \
          -p 127.0.0.1:4577:4577 \
          -e FLOCI_AZ_TLS_ENABLED=true \
          -e FLOCI_AZ_SERVICES_FUNCTIONS_ENABLED=false \
          -e FLOCI_AZ_SERVICES_VM_MOCKED=false \
          -v /var/run/docker.sock:/var/run/docker.sock \
          docker.io/floci/floci-az@sha256:0930cc3fe09014c40f266e261b93b0bd0ec99daa83b08d3b1ec0203caeb8e390

    - name: Wait for Floci-AZ
      run: |
        for attempt in $(seq 1 60); do
          if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:4577/_floci/health >/dev/null; then
            exit 0
          fi
          sleep 2
        done
        echo "Floci-AZ did not become healthy in time." >&2
        docker logs "$FLOCI_CONTAINER" || true
        exit 1

    # Trust the CA generated by this Floci container without disabling TLS verification.
    - name: Trust Floci-AZ CA
      run: |
        umask 077
        mkdir -p "$RUNNER_TEMP/floci-ca"
        docker cp "$FLOCI_CONTAINER:/app/data/tls/floci-az-selfsigned-ca.crt" "$RUNNER_TEMP/floci-ca/floci-ca.crt"
        docker cp "$FLOCI_CONTAINER:/app/data/tls/floci-az-selfsigned.crt" "$RUNNER_TEMP/floci-ca/server.crt"
        docker cp "$FLOCI_CONTAINER:/app/data/tls/floci-az-selfsigned.key" "$RUNNER_TEMP/floci-ca/server.key"
        chmod 600 "$RUNNER_TEMP/floci-ca/server.key"
        cat /etc/ssl/certs/ca-certificates.crt "$RUNNER_TEMP/floci-ca/floci-ca.crt" > "$RUNNER_TEMP/floci-ca/ca-bundle.crt"
        curl --fail --silent --show-error --max-time 10 \
          --cacert "$RUNNER_TEMP/floci-ca/ca-bundle.crt" \
          'https://127.0.0.1:4577/metadata/endpoints?api-version=2022-09-01' > /dev/null
        echo "SSL_CERT_FILE=$RUNNER_TEMP/floci-ca/ca-bundle.crt" >> "$GITHUB_ENV"
        echo "FLOCI_KEYVAULT_TLS_CERT=$RUNNER_TEMP/floci-ca/server.crt" >> "$GITHUB_ENV"
        echo "FLOCI_KEYVAULT_TLS_KEY=$RUNNER_TEMP/floci-ca/server.key" >> "$GITHUB_ENV"

    # Initialize a new or existing Terraform working directory by creating initial files, loading any remote state, downloading modules, etc.
    - name: Terraform Init
      run: terraform init

    # Checks that all Terraform configuration files adhere to a canonical format
    - name: Terraform Format
      run: terraform fmt -check

    # Generate an ephemeral key pair for the VM configuration.
    - name: Generate SSH key
      run: |
        umask 077
        mkdir -p keys
        if [ -e keys/id_ed25519 ] || [ -e keys/id_ed25519.pub ]; then
          echo "SSH key already exists; refusing to overwrite it." >&2
          exit 1
        fi
        ssh-keygen -q -t ed25519 -N "" -f keys/id_ed25519

    - name: Terraform Validate
      run: terraform validate
    
    - name: Terraform Plan
      run: bash scripts/terraform-floci-keyvault.sh plan -input=false

      # On push to "main", build or change infrastructure according to Terraform configuration files
      # Note: It is recommended to set up a required "strict" status check in your repository for "Terraform Cloud". See the documentation on "strict" required status checks for more information: https://help.github.com/en/github/administering-a-repository/types-of-required-status-checks
    - name: Terraform Apply
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: bash scripts/terraform-floci-keyvault.sh apply -auto-approve -input=false

    # Test the deployed web page with a real headless browser.
    - name: Check deployed web page in browser
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      timeout-minutes: 3
      run: |
        url="http://127.0.0.1:8080/html-prueba.html"
        ready=false
        for attempt in $(seq 1 30); do
          if curl --fail --silent --show-error --max-time 2 "$url" -o /dev/null; then
            ready=true
            break
          fi
          sleep 2
        done
        if [ "$ready" != true ]; then
          echo "La web desplegada no responde en $url." >&2
          exit 1
        fi

        browser=""
        for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
          if command -v "$candidate" >/dev/null 2>&1; then
            browser="$candidate"
            break
          fi
        done
        if [ -z "$browser" ]; then
          echo "No se encontró Chrome o Chromium en el runner." >&2
          exit 1
        fi

        dom="$RUNNER_TEMP/floci-web-dom.html"
        timeout 45s "$browser" --headless --no-sandbox --disable-gpu \
          --disable-dev-shm-usage --virtual-time-budget=10000 --dump-dom "$url" > "$dom"
        if ! grep -Fq '<title>HTML de prueba</title>' "$dom"; then
          echo "El navegador no recibió la página esperada." >&2
          exit 1
        fi
        if ! grep -Eq 'id="vm-name">[[:space:]]*vmone' "$dom"; then
          echo "La página no cargó el estado esperado de vmone desde status.json." >&2
          exit 1
        fi
        echo "La página y el estado de vmone se cargaron correctamente en el navegador."

    - name: Remove Floci-AZ and its data
      if: always()
      run: |
        if docker container inspect "${FLOCI_CONTAINER}-web" >/dev/null 2>&1; then
          docker rm -f "${FLOCI_CONTAINER}-web"
        fi
        if docker container inspect "$FLOCI_CONTAINER" >/dev/null 2>&1; then
          docker rm -fv "$FLOCI_CONTAINER"
        fi
